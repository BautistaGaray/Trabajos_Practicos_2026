<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!--Ejercicio 1-->
    <div class="container">
        <h1>1) Termómetro digital</h1>
        <div class="datos">
            <!--Datos de usuario-->
            <input type="number" name="temp" id="inputEjercicio1" placeholder="Ingresa la temperatura en grados. Ejemplo: 32">
        </div>

        <div class="resultados">
            <!--Boton para verificar el resultado-->
            <button id="botonEjercicio1">Verificar temperatura</button>

            <!--Texto para mostrar el resultado-->
            <h3 id="parrafoEjercicio1">Cargando resultado...</h3>
        </div>
    </div>


    <!--Ejercicio 2-->
    <div class="container">
        <h1>2) Clasificador de basura</h1>
        <div class="datos">
            <!--Datos de usuario-->
            <input type="text" name="dias" id="inputEjercicio2" placeholder="¿Es orgánico o no orgánico?">
        </div>

        <div class="resultados">
            <!--Boton para verificar el resultado-->
            <button id="botonEjercicio2">Verificar basura</button>

            <!--Texto para mostrar el resultado-->
            <h3 id="parrafoEjercicio2">Cargando resultado...</h3>
        </div>
    </div>


    <!--Ejercicio 3-->
    <div class="container">
        <h1>3) Iniciar sesion</h1>

        <div class="datos-3">
            <!--Datos de usuario: usuario-->
            <input type="text" name="usuario" id="inputEjercicio3"
                placeholder="Ingresa el usuario">

            <!--Datos de usuario: contraseña-->
            <input type="password" name="contrasenia" id="input2Ejercicio3"
                placeholder="Ingresar contraseña">
        </div>

        <div class="resultados">
            <!--Boton para verificar el resultado-->
            <button id="botonEjercicio3">Iniciar sesión</button>

            <!--Texto para mostrar el resultado-->
            <h3 id="parrafoEjercicio3">Cargando resultado...</h3>
        </div>
    </div>


    <!--Ejercicio 4-->
    <div class="container">
        <h1>4) Asistencia alumno</h1>

        <div class="datos">
            <!--Datos de usuario-->
            <input type="text" name="nombre" id="inputEjercicio4"
                placeholder="Ingresa el nombre">
        </div>

        <div class="resultados">
            <!--Boton para verificar el resultado-->
            <button id="botonEjercicio4">Verificar asistencia</button>

            <!--Texto para mostrar el resultado-->
            <h3 id="parrafoEjercicio4">Cargando resultado...</h3>
        </div>
    </div>


</body>

<script src="albarracin_bautista.js"></script>

</html>
